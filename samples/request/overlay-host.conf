# Run on the host's own network stack, for testing without root.
#
# native_sim normally reaches the network through the "zeth" TAP interface,
# which needs root to create. With offloaded sockets the socket calls go
# straight to the host, so the sample reaches a nats-server on localhost.

CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n

# The host stack provides the addressing.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_NEED_IPV4=n

CONFIG_SAMPLE_NATS_URL="nats://127.0.0.1:4222"
