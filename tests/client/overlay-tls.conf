# TLS build of the client tests. scripts/run-client-tests.sh passes the test
# CA as -DNATS_TEST_CA=<file.der> and starts a TLS server for it.

CONFIG_NATS_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4
CONFIG_TLS_CREDENTIALS=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y

# The TLS handshake runs on the receive thread.
CONFIG_NATS_THREAD_STACK_SIZE=8192
