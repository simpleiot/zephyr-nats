CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

# Run on the host's network stack through offloaded sockets, so the tests
# reach a nats-server on localhost without a TAP interface or root.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZVFS_OPEN_MAX=32

CONFIG_NATS=y
CONFIG_NATS_LOG_LEVEL_INF=y
CONFIG_LOG=y

# Short timers so fault tests finish quickly.
CONFIG_NATS_PING_INTERVAL_MS=500
CONFIG_NATS_MAX_PINGS_OUT=2
CONFIG_NATS_CONNECT_TIMEOUT_MS=2000
CONFIG_NATS_RECONNECT_MIN_MS=100
CONFIG_NATS_RECONNECT_MAX_MS=400

# Keep simulated time in step with the host, so poll timeouts do not expire
# before data from the real server arrives.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
