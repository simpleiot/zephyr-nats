name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@v5
        with:
          path: modules/lib/zephyr-nats
          # checkpatch below compares against the base of the branch.
          fetch-depth: 0

      # "west init -l" puts the workspace at the parent of app-path, so the
      # workspace ends up at modules/lib, matching self.path in west.yml.
      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          base-path: modules/lib
          app-path: zephyr-nats
          toolchains: x86_64-zephyr-elf

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # The current server supports handshake_first, which the TLS tests need.
      - name: Install nats-server and the nats CLI
        run: |
          go install github.com/nats-io/nats-server/v2@latest
          go install github.com/nats-io/natscli/nats@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Builds the samples and every test configuration, and runs the parser
      # tests. The client tests are build-only here; the next step runs them.
      - name: Build and run with twister
        working-directory: modules/lib/zephyr-nats
        run: |
          west twister \
            --testsuite-root samples \
            --testsuite-root tests \
            --platform native_sim \
            --inline-logs \
            --verbose

      - name: Run the client tests
        working-directory: modules/lib/zephyr-nats
        run: scripts/run-client-tests.sh

      - name: Run the interoperability checks
        working-directory: modules/lib/zephyr-nats
        run: scripts/run-interop.sh

      # Style settings come from .checkpatch.conf; the typedefs list it relies
      # on ships with Zephyr, so point at the copy in the workspace.
      - name: Run checkpatch on the changes
        if: always()
        working-directory: modules/lib/zephyr-nats
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          base="${BASE_SHA:-HEAD~1}"
          zephyr_base="$(west list -f '{abspath}' zephyr)"
          git diff "$base"..HEAD | \
            "$zephyr_base/scripts/checkpatch.pl" --no-tree \
              --typedefsfile="$zephyr_base/scripts/checkpatch/typedefsfile" -

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: twister-results
          path: modules/lib/zephyr-nats/twister-out/twister.xml
          if-no-files-found: ignore
